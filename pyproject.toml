[project]
name = "purespace"
version = "0.1.0"
description = "PureSpace: A Benchmark for Abstract Spatial Reasoning in Vision-Language Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bpy>=5.0.1",
    "opencv-python>=4.11.0.86",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["purespace"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
